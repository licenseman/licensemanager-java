    CancellationStats:
      description: Cancellations of the licenses with a money back guarantee. Licenses
        canceled without one are left out.
      properties:
        licenseCount:
          description: "Number of licenses with a money back guarantee: a `cancellableUntil`."
          example: 80
          type: integer
        canceledLicenseCount:
          description: Number of them that were canceled.
          example: 4
          type: integer
        cancellableLicenseCount:
          description: "Number of them whose money back guarantee hasn't ended, and\
            \ that weren't canceled: they can still be."
          example: 12
          type: integer
        rate:
          description: "Share of them that were canceled, from 0 to 1: `canceledLicenseCount`\
            \ over `licenseCount`."
          example: 0.05
          type: number
        canceledByDay:
          description: "Number of them canceled each day, aligned on `days`, on the\
            \ day of their cancellation."
          example:
          - 0
          - 1
          - 0
          items:
            type: integer
          type: array
          default: null
        canceledByMonth:
          description: "Number of them canceled each month, aligned on `months`, on\
            \ the month of their cancellation."
          example:
          - 1
          - 0
          - 2
          items:
            type: integer
          type: array
          default: null
        byReason:
          description: "Number of them canceled for each reason, from the most given\
            \ one. Reasons never given are left out."
          items:
            $ref: "#/components/schemas/CancellationStats_byReason_inner"
          type: array
          default: null
      required:
      - byReason
      - canceledByDay
      - canceledByMonth
      - canceledLicenseCount
      - cancellableLicenseCount
      - licenseCount
      - rate
    CancellationReason:
      description: |-
        - `too_expensive`: too expensive.
        - `missing_features`: missing features i need.
        - `not_working`: doesn't work as expected.
        - `switched`: found an alternative.
        - `unused`: no longer needed.
        - `other`: other.
      enum:
      - too_expensive
      - missing_features
      - not_working
      - switched
      - unused
      - other
      example: too_expensive
      type: string
