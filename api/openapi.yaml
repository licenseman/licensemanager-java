        explode: true
        in: query
        name: neverExpires
        required: false
        schema:
          description: "`true` only returns the licenses that never expire, `false`\
            \ only the ones with an expiration date."
          enum:
          - "true"
          - "false"
          example: "true"
          type: string
        style: form
      - description: Only returns the licenses paid in this currency.
        explode: true
        in: query
        name: currency
        required: false
        schema:
          description: Only returns the licenses paid in this currency.
          example: USD
          type: string
        style: form
      - description: "Only returns the licenses paid exactly this amount, in major\
          \ units of its currency: combine with `currency` to compare amounts of one\
          \ currency. Licenses without a price are left out."
        explode: true
        in: query
        name: price
        required: false
        schema:
          description: "Only returns the licenses paid exactly this amount, in major\
            \ units of its currency: combine with `currency` to compare amounts of\
            \ one currency. Licenses without a price are left out."
          example: 49.99
          type: number
        style: form
      - description: "Only returns the licenses paid at least this amount, in major\
          \ units of its currency: combine with `currency` to compare amounts of one\
          \ currency. Licenses without a price are left out."
        explode: true
        in: query
        name: priceMin
        required: false
        schema:
          description: "Only returns the licenses paid at least this amount, in major\
            \ units of its currency: combine with `currency` to compare amounts of\
            \ one currency. Licenses without a price are left out."
