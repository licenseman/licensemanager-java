  /v1/products/{id}/reset:
    post:
      description: |-
        Deletes the customers, licenses, machines, policies and releases of the test product, with their events, then copies the policies, releases, portal settings and `autoMachineChange` of its live product again. Its id, name and slug are kept, but the copied policies get new ids. The tokens of its customers, licenses and machines stop working.

        **Required role permission**: `product:update` when called with a session, granted by the member's role. API keys aren't limited by roles.
      operationId: resetProduct
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          example: x7Kp2QaZ
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
          description: Reset product
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "`not_test_product`: the product is a live product"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "`unauthorized`: no credentials. `invalid_api_key`: the API\
            \ key doesn't exist, was revoked or has expired. `invalid_token`: the\
            \ token's signature is invalid, it has expired, or the resource it's scoped\
            \ to was deleted"
        "402":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "`plan_limit_exceeded`: the organization stayed over its plan's\
            \ limits after the grace period, its API is blocked until it upgrades.\
            \ `plan_limit_reached`: creating the resource would go over the plan's\
            \ limit"
        "403":
          content:
            application/json:
              schema:
