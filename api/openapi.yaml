          maximum: 2147483647
          minimum: 3600
          type: integer
        price:
          $ref: "#/components/schemas/PriceInput"
        maxVersion:
          $ref: "#/components/schemas/LicenseMaxVersionInput"
        cancellableUntil:
          description: "End of the money back guarantee: until then, the customer\
            \ can cancel the license from the customer portal, or with a token. `null`\
            \ to not let them. Defaults to the creation date plus the policy's `moneyBackGuaranteeDays`,\
            \ or `null` when it has none."
          example: 2026-02-14T09:30:00.000Z
          format: date-time
          nullable: true
          type: string
        sendKey:
          description: "`true` emails the key to the customer once the license is\
            \ created, like `sendLicenseKeys`. Sent in the background: a failed email\
            \ doesn't fail the creation. In test products, it's only sent when the\
