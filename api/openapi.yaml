          description: "`\"2\"` allows every 2.y.z version: the minor versions and\
            \ bug fixes of version 2. `\"2.3\"` allows every 2.3.z version: the bug\
            \ fixes of version 2.3. Bug fixes can't be locked, so patch numbers like\
