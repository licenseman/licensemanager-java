components:
  parameters: {}
  schemas:
    LicenseToken:
      example:
        license: eyJhbGciOiJFZERTQSIsInR5cCI6IkpXVCIsImtpZCI6Ims4UjJ2TnFXIn0…
      properties:
        license:
          description: |-
            JWT signed with the Ed25519 key of the product's organization (`alg: EdDSA`, `kid`: id of the key). Its claims:

            - `iss`: name of the organization. It changes when the organization is renamed: check `aud` rather than `iss`.
            - `aud`: id of the product. Test and live products share the organization's key, so check `aud` to refuse the tokens of a test product.
            - `sub`: license key.
            - `fp`: fingerprint of the machine.
            - `mv`: the license's `maxVersion.version`, like `"2.3"`, so the application can check the versions it updates to offline. `null` when it allows every version.
            - `iat`: when the token was issued.
            - `nbf`: two hours before `iat`, so machines whose clock is behind accept the token.
            - `exp`: the license's `maxOfflineDurationSeconds` after `iat`, or when the license expires if that's sooner.
          example: eyJhbGciOiJFZERTQSIsInR5cCI6IkpXVCIsImtpZCI6Ims4UjJ2TnFXIn0…
          type: string
      required:
      - license
    Error:
      example:
        error:
          code: not_found
          message: Resource not found
          issues:
          - path:
            - name
            message: "Too small: expected string to have >=1 characters"
          - path:
            - name
            message: "Too small: expected string to have >=1 characters"
      properties:
        error:
          $ref: "#/components/schemas/Error_error"
      required:
      - error
    ValidateKeyError:
      example:
        error:
          code: not_found
          message: Resource not found
          issues:
          - path:
            - name
            message: "Too small: expected string to have >=1 characters"
          - path:
            - name
            message: "Too small: expected string to have >=1 characters"
          latestAllowedVersion: 2.3.1
      properties:
        error:
          $ref: "#/components/schemas/ValidateKeyError_error"
      required:
      - error
    ValidateKey:
      example:
        key: 7KQ2M-X9ZPA-H4TRC-WN6EY-B3JDF
        fingerprint: 4c:32:75:8f:9a:1e
        version: 1.4.2
        name: Jane's MacBook
        platform: macOS
      properties:
        key:
          description: "License key, compared exactly: keys are case sensitive."
          example: 7KQ2M-X9ZPA-H4TRC-WN6EY-B3JDF
          maxLength: 255
          minLength: 1
          type: string
        fingerprint:
          description: "Identifies the machine. Unique within the license. Compared\
            \ exactly, case included: a different fingerprint is another machine."
          example: 4c:32:75:8f:9a:1e
          maxLength: 255
          minLength: 1
          type: string
        version:
          description: "Version of the application running on the machine, like `\"\
            1.4.2\"`. Its major and minor numbers are checked against the license's\
            \ `maxVersion.version`: a `v` prefix and a pre-release are accepted, `\"\
            v2.3.0-beta.1\"` counting as 2.3, and a version that doesn't start with\
            \ a number is refused when the license has a `maxVersion.version`. It\
            \ doesn't have to be one of the product's releases."
          example: 1.4.2
          maxLength: 100
          minLength: 1
          type: string
        name:
          description: Name of the machine. Replaces the current one when given.
          example: Jane's MacBook
          maxLength: 200
          minLength: 1
          type: string
        platform:
          description: Platform of the machine. Replaces the current one when given.
          example: macOS
          maxLength: 100
          minLength: 1
          type: string
      required:
      - fingerprint
      - key
      - version
    Portal:
      example:
        productId: x7Kp2QaZ
        productName: Acme Pro
        organizationName: Acme
        logoUrl: https://cdn.example.com/logos/x7Kp2QaZ/k3f9a2LpQ7xw.webp
        brandColor: "#1e3a8a"
        accentColor: "#2563eb"
        returnUrl: https://example.com/account
      properties:
        productId:
          example: x7Kp2QaZ
          type: string
        productName:
          example: Acme Pro
