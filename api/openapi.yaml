  /v1/customers/{customerId}/licenses:
    get:
      description: |-
        Sorting by `lastActivatedAt` puts the licenses never activated last in both orders. Sorting by `price` compares the amounts whatever their currency, and puts the licenses without a price last in both orders.

        **Token access**: customer tokens with the `license:read` permission (or the matching write one). A customer token reaches its own licenses.
      operationId: listCustomerLicenses
      parameters:
      - explode: false
        in: path
        name: customerId
        required: true
        schema:
          example: c9Wd3RtE
          type: string
        style: simple
      - description: "Page to return. Pages are numbered from 1: `1` is the first\
          \ page. A page past the last one returns an empty `data`, not an error.\
          \ Defaults to `1`."
        explode: true
        in: query
        name: page
        required: false
        schema:
          default: 1
          description: "Page to return. Pages are numbered from 1: `1` is the first\
            \ page. A page past the last one returns an empty `data`, not an error.\
            \ Defaults to `1`."
          example: 1
          minimum: 1
          type: integer
        style: form
      - description: "Maximum number of items per page, from 1 to 100. Every page\
          \ holds this many items except the last one, which can hold fewer. Defaults\
          \ to `20`."
        explode: true
        in: query
        name: pageSize
        required: false
        schema:
          default: 20
          description: "Maximum number of items per page, from 1 to 100. Every page\
            \ holds this many items except the last one, which can hold fewer. Defaults\
            \ to `20`."
          example: 20
          maximum: 100
          minimum: 1
          type: integer
        style: form
      - description: "Field to sort by, prefixed with `-` for descending order. Defaults\
          \ to `-createdAt`."
        explode: true
        in: query
        name: sort
        required: false
        schema:
          default: -createdAt
          description: "Field to sort by, prefixed with `-` for descending order.\
            \ Defaults to `-createdAt`."
          enum:
          - key
          - -key
          - createdAt
          - -createdAt
          - expiresAt
          - -expiresAt
          - maxMachines
          - -maxMachines
          - maxOfflineDurationSeconds
          - -maxOfflineDurationSeconds
          - lastActivatedAt
          - -lastActivatedAt
          - lockMajorAt
          - -lockMajorAt
          - lockMinorAt
          - -lockMinorAt
          - updatedAt
          - -updatedAt
          - price
          - -price
          example: -createdAt
          type: string
        style: form
      - description: Case-insensitive text the key contains.
        explode: true
        in: query
        name: search
        required: false
        schema:
          description: Case-insensitive text the key contains.
          example: X9ZPA
          maxLength: 200
          minLength: 1
          type: string
        style: form
      - description: "Only returns the license with this exact key, case included.\
          \ Keys of test products start with `TEST-`."
        explode: true
        in: query
        name: key
        required: false
        schema:
          description: "Only returns the license with this exact key, case included.\
            \ Keys of test products start with `TEST-`."
          example: 7KQ2M-X9ZPA-H4TRC-WN6EY-B3JDF
          type: string
        style: form
      - description: Only returns the licenses following this policy.
        explode: true
        in: query
        name: policyId
        required: false
        schema:
          description: Only returns the licenses following this policy.
          example: p4Rt8LmQ
          type: string
        style: form
      - description: Only returns the licenses with at least one active machine running
          this version of the product.
        explode: true
        in: query
        name: machineVersion
        required: false
        schema:
          description: Only returns the licenses with at least one active machine
            running this version of the product.
          example: 2.3.1
          type: string
        style: form
      - description: Only returns the licenses with this status.
        explode: true
        in: query
        name: status
        required: false
        schema:
          allOf:
          - $ref: "#/components/schemas/LicenseStatus"
          description: Only returns the licenses with this status.
        style: form
      - description: Only returns the licenses created at or after this date.
        explode: true
        in: query
        name: createdFrom
        required: false
        schema:
          description: Only returns the licenses created at or after this date.
          example: 2026-01-01T00:00:00.000Z
          format: date-time
          type: string
        style: form
      - description: Only returns the licenses created at or before this date.
        explode: true
        in: query
        name: createdTo
        required: false
        schema:
          description: Only returns the licenses created at or before this date.
          example: 2026-02-01T00:00:00.000Z
          format: date-time
          type: string
        style: form
      - description: Only returns the licenses last activated at or after this date.
          Licenses never activated are left out.
        explode: true
        in: query
        name: lastActivatedFrom
        required: false
        schema:
          description: Only returns the licenses last activated at or after this date.
            Licenses never activated are left out.
          example: 2026-01-01T00:00:00.000Z
          format: date-time
          type: string
        style: form
      - description: Only returns the licenses last activated at or before this date.
          Licenses never activated are left out.
        explode: true
        in: query
        name: lastActivatedTo
        required: false
        schema:
          description: Only returns the licenses last activated at or before this
            date. Licenses never activated are left out.
          example: 2026-02-01T00:00:00.000Z
          format: date-time
          type: string
        style: form
      - description: "`true` only returns the licenses never activated, `false` only\
          \ the ones activated at least once."
        explode: true
        in: query
        name: neverActivated
        required: false
        schema:
          description: "`true` only returns the licenses never activated, `false`\
            \ only the ones activated at least once."
          enum:
          - "true"
          - "false"
          example: "true"
          type: string
        style: form
      - description: Only returns the licenses expiring at or after this date. Licenses
          that never expire are left out.
        explode: true
        in: query
        name: expiresFrom
        required: false
        schema:
          description: Only returns the licenses expiring at or after this date. Licenses
