      - type
    EventType:
      description: |-
        - `policy.created`: `payload` holds the policy's settings.
        - `policy.updated`: `payload.changes` maps each changed field to its previous (`from`) and new (`to`) value. Making a policy the default also updates the previous default one.
        - `license.created`: `payload` holds the license's key, `policyId`, `customerId` and settings. Not linked to the policy.
        - `license.updated`: `payload.changes`, like `policy.updated`.
        - `license.validated`: a machine validated the license key. `payload` holds the machine's `fingerprint`, `name` and `version`, whether the validation created the machine (`machineCreated`) or activated it again (`machineActivated`), the `overriddenMachineId` of the machine it deactivated to take its place, `null` when none, and the `lockedMachineIds` of the machines it locked as it took its place back (see `validateKey`).
        - `license.validation_failed`: validating the license key failed. `payload` holds the error `code` and `message`, and the `fingerprint`, `name`, `platform` and `version` sent, the name and platform being the machine's when none is sent. Linked to the machine when it exists.
        - `license.canceled`: the license was canceled. `payload` holds the cancellation `reason` and `comment`, and whether its Stripe payment is being refunded (`refund`).
        - `license.refunded`: the Stripe payment of a canceled license was refunded. `payload` holds the Stripe `refundId` and the `amount` refunded. Has the `integration` actor.
        - `license.refund_failed`: refunding the Stripe payment of a canceled license failed. `payload` holds the error `message`: refund it from Stripe. Has the `integration` actor.
        - `machine.deactivated`: a machine was deactivated or locked, so it no longer counts as using the license. `payload` holds the machine's `fingerprint` and `name`, the `overriddenByMachineId` of the machine that took its place, `null` when it was deactivated through the API, and whether it was `locked`. Deactivations by validations have the `automation` actor. Linked to the license and the machine.

        An update that changes nothing records no event. Deletions record no events, and customers, products and releases have none.
      enum:
      - policy.created
      - policy.updated
      - license.created
      - license.updated
      - license.validated
      - license.validation_failed
      - license.canceled
      - license.refunded
      - license.refund_failed
      - machine.deactivated
      example: license.validated
      type: string
    EventMachine:
      description: "The machine the event is about, with its current name. `null`\
        \ when the event has no machine or it has been deleted."
      example:
        id: m9Tq3VhD
        name: Jane's MacBook
        fingerprint: 4c:32:75:8f:9a:1e
      nullable: true
      properties:
        id:
