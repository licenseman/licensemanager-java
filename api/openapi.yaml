    LicenseMaxVersion:
      description: "Latest version of the product the license can use: its hard-coded\
        \ `version`, else the versions released before its locks. All `null` when\
        \ it can use every version."
      example:
        version: "2.3"
        lockMajorAt: 2026-02-15T09:30:00.000Z
        lockMinorAt: 2027-01-15T09:30:00.000Z
      properties:
        version:
          description: "Hard-coded latest version, taking precedence over `lockMajorAt`\
            \ and `lockMinorAt`. `\"2\"` allows every 2.y.z version: its minor versions\
            \ and bug fixes. `\"2.3\"` allows every 2.3.z version: its bug fixes.\
            \ `null` when it's not hard-coded."
          example: "2.3"
          nullable: true
          pattern: "^(0|[1-9]\\d*)(\\.(0|[1-9]\\d*))?$"
          type: string
        lockMajorAt:
          description: "When the major version of the license locks: it then only\
            \ gets the minor versions and bug fixes of the major version released\
            \ by then. Once reached, within the hour, the major version of the latest\
            \ stable release by then is hard-coded in `version`, unless a version\
            \ already is, and the lock is cleared. A lock reached before any stable\
            \ release is cleared without hard-coding anything. `null` when it's never\
            \ locked."
          example: 2026-02-15T09:30:00.000Z
          format: date-time
          nullable: true
          type: string
        lockMinorAt:
          description: "When the minor version of the license locks: it then only\
            \ gets the bug fixes of the minor version released by then, within the\
            \ hard-coded major version when there's one. Never before `lockMajorAt`;\
            \ without it, the major version locks along with the minor version. Once\
            \ reached, within the hour, the major and minor version of the latest\
            \ stable release by then is hard-coded in `version`, unless a minor version\
            \ already is, and the lock is cleared. A lock reached before any matching\
            \ stable release is cleared without hard-coding anything. `null` when\
            \ it's never locked."
          example: 2027-01-15T09:30:00.000Z
          format: date-time
          nullable: true
          type: string
      required:
      - lockMajorAt
      - lockMinorAt
      - version
    Price:
      description: "Price paid for a license. Licenses have `null` instead when it's\
        \ unknown, which leaves them out of the revenue stats."
      example:
        amount: 49.99
        currency: USD
      nullable: true
      properties:
        amount:
          description: "Amount in major units of the currency: `49.99` for $49.99,\
