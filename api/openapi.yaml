            \ `O`, `0`, `I` and `1`, for 125 random bits. Starts with `TEST-` in test\
            \ products, which is added when missing, and removed in live products."
          example: 7KQ2M-X9ZPA-H4TRC-WN6EY-B3JDF
          maxLength: 255
          minLength: 1
          type: string
        policyId:
          description: Policy of the product the license follows. Defaults to the
            product's default policy.
          example: p4Rt8LmQ
          type: string
        expiresAt:
          description: "`null` makes the license never expire. Defaults to the creation\
            \ date plus the duration of the policy, or `null` when the policy has\
