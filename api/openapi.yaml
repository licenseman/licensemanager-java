openapi: 3.1.0
info:
  description: |-
    Public API. Authenticate with an organization API key, or with a token scoped to a customer, license or machine on the endpoints that accept one.

    ## Conventions

    - **Errors** answer `{ "error": { "code", "message" } }`. Branch on `code`, which is stable, not on `message`. Each response lists the codes it can return, except `404`, which answers `not_found` unless it says otherwise. Unexpected errors answer `500` with `internal_error`.
    - **Validation** errors answer `422`, not `400`, with the `validation_error` code and an `issues` array giving the `path` and `message` of each invalid value.
    - **Unknown body fields are ignored**, not rejected: sending a field an endpoint doesn't accept, like `policyId` to `updateLicense`, changes nothing and doesn't fail.
    - **Strings** are trimmed before they're validated and stored. Emails are stored lower cased.
    - **Updates** only change the fields that are sent. A field sent as `null` is cleared, when it can be.
    - **Dates** can be sent with any offset, and are always returned in UTC, like `2026-01-15T09:30:00.000Z`. Calendar months and days are counted in UTC.
    - **Ids** are 8 letters and digits, after `test_` for test products and their resources.
    - **Lists** are paginated with `page` and `pageSize`. Items with the same value for the `sort` field are ordered by id, so pages are stable, but items created or deleted between two requests shift the pages. Items without a value for the `sort` field come last in ascending order, and first in descending order, unless the endpoint says otherwise.
    - **Test products** are sandboxes of a live product. Test API keys only reach test products, live API keys only live ones: the others answer `404`, as if they didn't exist. Sessions and tokens reach both.
  title: LicenseManager API
  version: 1.0.0
externalDocs:
  description: LicenseManager website
  url: https://licensemanager.dev
servers:
- url: https://api.licensemanager.dev
security:
- apiKey: []
paths:
  /v1/products/{productId}/validate-key:
    post:
      description: |-
        Checks the license key of the product on a machine and returns a token the application can verify offline with the organization's public key. Doesn't need authentication.

        The license must allow the `version`: up to its `maxVersion.version` when it has one, like `"2.3"` for every 2.3.z version and older. Its `maxVersion.lockMajorAt` and `maxVersion.lockMinorAt` are enforced once they hard-code `maxVersion.version`, within the hour they're reached. When it doesn't, the error's `latestAllowedVersion` is the latest release of the product the license allows, so the application can offer to install it.

        The machine with the `fingerprint` is created when the license has none, and activated when it's deactivated, unless the license is already active on its maximum number of machines. A machine that's already active is never refused for the maximum number of machines, even when it was lowered below the number of active machines. Its `version`, and its `name` and `platform` when given, are updated: they can't be cleared.

        Unless the product disables `autoMachineChange`, a new machine isn't refused when the license is on its maximum number of machines: it takes the place of the active machine validated the longest ago, which is deactivated with its `overriddenByMachineId` set to the new machine, and recorded as a `machine.deactivated` event. When a machine deactivated this way is validated again, it takes its place back: the machine that overrode it, and the ones that overrode that one in turn, are locked, with their `overriddenByMachineId` set to the machine coming back. A locked machine is always refused, so two machines can't take turns on one place.

        The checks run in this order, and the first one failing answers: the license has expired or was canceled, then it doesn't allow the version, then the machine is locked, then it's on its maximum number of machines. Each failure is recorded as a `license.validation_failed` event, except for keys that don't exist.

        Changes to the license, like deactivating the machine or shortening its expiration, don't revoke the tokens already returned: the application only sees them when it validates its key again, at the latest when its token expires.
      operationId: validateKey
      parameters:
      - explode: false
        in: path
        name: productId
        required: true
        schema:
          example: x7Kp2QaZ
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidateKey"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LicenseToken"
          description: Signed license token
        "402":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "`plan_limit_exceeded`: the organization stayed over its plan's\
            \ limits after the grace period"
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidateKeyError"
          description: "`license_expired`: the license has expired, or was canceled.\
            \ `version_not_allowed`: the license doesn't allow the version, with the\
            \ `latestAllowedVersion`. `machine_locked`: the machine was locked after\
            \ the machine it overrode came back. `machine_limit_reached`: the license\
            \ is already active on its maximum number of machines, and the product\
            \ disables `autoMachineChange` or the machine isn't new"
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "`not_found`: the product doesn't exist, or has no license\
            \ with this key"
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "`validation_error`: invalid body"
      security: []
      summary: Validate a license key
      tags:
      - Licenses
      x-content-type: application/json
      x-accepts:
      - application/json
  /v1/portal/{productId}:
    get:
      description: "Names of the product and of its organization, colors of the customer\
        \ portal, and link back to the product's website. Answers `404` when the product's\
        \ customer portal is disabled: with the `portal_disabled` code and the slugs\
        \ of the product and its organization when signed in as a member of the organization,\
        \ so they can enable it. Doesn't need authentication."
      operationId: getPortal
      parameters:
      - explode: false
        in: path
        name: productId
        required: true
        schema:
          example: x7Kp2QaZ
          type: string
        style: simple
      - description: "Link back to your website to show, used when its domain is one\
          \ of the product's `returnDomains`."
        explode: true
        in: query
        name: returnUrl
        required: false
        schema:
          description: "Link back to your website to show, used when its domain is\
            \ one of the product's `returnDomains`."
          example: https://example.com/account
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Portal"
          description: Customer portal
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalNotFound"
          description: "`not_found`: product not found, or its customer portal is\
            \ disabled. `portal_disabled`: its customer portal is disabled, for members\
            \ of its organization"
      security: []
      summary: Get the customer portal of a product
      tags:
      - Portal
      x-accepts:
      - application/json
  /v1/portal/{productId}/request-link:
    post:
      description: "Emails the customer of the product with this email a link to the\
        \ customer portal, working for 1 hour. Answers `404` when the product's customer\
        \ portal is disabled. Answers the same whether the customer exists or not,\
        \ so the API doesn't tell which emails are customers. Test products only email\
        \ the members of the organization: the link isn't sent to other customers,\
        \ with the same answer. Doesn't need authentication."
      operationId: requestPortalLink
      parameters:
      - explode: false
        in: path
        name: productId
        required: true
        schema:
          example: x7Kp2QaZ
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestPortalLink"
        required: true
      responses:
        "204":
          description: "Link emailed, if the customer exists"
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "`not_found`: product not found, or its customer portal is\
            \ disabled"
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Validation error
      security: []
      summary: Email a link to the customer portal
      tags:
      - Portal
      x-content-type: application/json
      x-accepts:
      - application/json
  /v1/products:
    get:
      operationId: listProducts
      parameters:
      - description: "Page to return. Pages are numbered from 1: `1` is the first\
          \ page. A page past the last one returns an empty `data`, not an error.\
          \ Defaults to `1`."
        explode: true
        in: query
        name: page
        required: false
        schema:
          default: 1
          description: "Page to return. Pages are numbered from 1: `1` is the first\
            \ page. A page past the last one returns an empty `data`, not an error.\
            \ Defaults to `1`."
          example: 1
          minimum: 1
          type: integer
        style: form
      - description: "Maximum number of items per page, from 1 to 100. Every page\
          \ holds this many items except the last one, which can hold fewer. Defaults\
          \ to `20`."
        explode: true
        in: query
        name: pageSize
        required: false
        schema:
          default: 20
          description: "Maximum number of items per page, from 1 to 100. Every page\
            \ holds this many items except the last one, which can hold fewer. Defaults\
            \ to `20`."
          example: 20
          maximum: 100
          minimum: 1
          type: integer
        style: form
      - description: "Field to sort by, prefixed with `-` for descending order. Defaults\
          \ to `-createdAt`."
        explode: true
        in: query
        name: sort
        required: false
        schema:
          default: -createdAt
          description: "Field to sort by, prefixed with `-` for descending order.\
            \ Defaults to `-createdAt`."
          enum:
          - name
          - -name
          - slug
          - -slug
          - createdAt
          - -createdAt
          - updatedAt
          - -updatedAt
          example: -createdAt
          type: string
        style: form
      - description: Case-insensitive text the name or slug contains.
        explode: true
        in: query
        name: search
        required: false
        schema:
          description: Case-insensitive text the name or slug contains.
          example: pro
          maxLength: 200
          minLength: 1
          type: string
        style: form
      - description: Only returns the product with this exact slug.
        explode: true
        in: query
        name: slug
        required: false
        schema:
          description: Only returns the product with this exact slug.
          example: acme-pro
          type: string
        style: form
      - description: "Only returns the test products with `true`, the live ones with\
          \ `false`. API keys only list the products of their own mode."
        explode: true
        in: query
        name: isTest
        required: false
        schema:
          description: "Only returns the test products with `true`, the live ones\
            \ with `false`. API keys only list the products of their own mode."
          enum:
          - "true"
          - "false"
          example: "false"
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductList"
          description: One page of the products of the organization
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "`unauthorized`: no credentials. `invalid_api_key`: the API\
            \ key doesn't exist, was revoked or has expired. `invalid_token`: the\
            \ token's signature is invalid, it has expired, or the resource it's scoped\
            \ to was deleted"
        "402":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "`plan_limit_exceeded`: the organization stayed over its plan's\
            \ limits after the grace period, its API is blocked until it upgrades.\
            \ `plan_limit_reached`: creating the resource would go over the plan's\
            \ limit"
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "`token_not_allowed`: the endpoint doesn't accept tokens, or\
            \ not of this type. `insufficient_scope`: the token lacks the permission.\
            \ `no_active_organization` or `forbidden`: the session has no organization,\
            \ or isn't a member of the one requested"
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "`validation_error`: invalid path, query or body, with the\
            \ `issues`"
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "`rate_limited`: the API key made more than 10 requests in\
            \ the last second. Wait for the `Retry-After` seconds"
      summary: List products
      tags:
      - Products
      x-accepts:
      - application/json
    post:
      description: |-
        Without a `slug`, the product gets one derived from its name: lower cased, without accents and special characters (`Élan Pro 2!` becomes `elan-pro-2`).
        When another product of the organization already uses it, a dash and 3 random lowercase letters or digits are appended (`elan-pro-2-k3f`), until the slug is free.

        An explicit `slug` is used as is: the request fails with a `409` when it's taken, it's never changed.

        Slug uniqueness is enforced by the database, so when concurrent requests end up with the same slug, only one succeeds and the others get a `409`, even without an explicit `slug`. Retrying such a request without a `slug` derives a new one.

        The product is created with its default policy, named `Default policy` with the `default` slug, whose settings are given by `defaultPolicy`. Omitted settings default to licenses that never expire, on a single machine, offline for one week, for every version of the product. Unlike `createPolicy`, where `maxMachines` defaults to no limit.

        With `isTestFromProductId`, the product is a test product: its id, its slug, and the ids, slugs and license keys of its resources start with `test_` (`TEST-` for license keys), and only test API keys reach it. It starts with copies of the policies, releases, portal settings and `autoMachineChange` of the live product, `defaultPolicy` is ignored. Later changes to the live product aren't copied: reset the test product to copy them again. Test API keys can only create test products, live API keys only live ones.

        **Required role permission**: `product:create` when called with a session, granted by the member's role. API keys aren't limited by roles.
      operationId: createProduct
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductWithPolicy"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
          description: Created product
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "`unauthorized`: no credentials. `invalid_api_key`: the API\
            \ key doesn't exist, was revoked or has expired. `invalid_token`: the\
            \ token's signature is invalid, it has expired, or the resource it's scoped\
            \ to was deleted"
        "402":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "`plan_limit_exceeded`: the organization stayed over its plan's\
            \ limits after the grace period, its API is blocked until it upgrades.\
            \ `plan_limit_reached`: creating the resource would go over the plan's\
            \ limit"
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "`api_key_mode`: the API key's mode doesn't match the product's:\
            \ test keys only create test products, live keys only live ones"
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "`not_found`: `isTestFromProductId` isn't a live product of\
            \ the organization"
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "`slug_taken`: the explicit slug is already used by another\
            \ product of the organization, or a concurrent request took the same slug\
            \ first"
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "`validation_error`: invalid path, query or body, with the\
            \ `issues`"
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "`rate_limited`: the API key made more than 10 requests in\
            \ the last second. Wait for the `Retry-After` seconds"
      summary: Create a product
      tags:
      - Products
      x-required-permissions:
      - product:create
      x-content-type: application/json
      x-accepts:
      - application/json
  /v1/products/{id}:
    delete:
      description: |-
        Deletes the product along with its policies, customers and releases, and its test products with everything they hold. A live product that licenses belong to can't be deleted: delete them first. A test product can always be deleted, along with its licenses and machines. The events of the deleted policies and licenses can no longer be listed.

        **Required role permission**: `product:delete` when called with a session, granted by the member's role. API keys aren't limited by roles.
      operationId: deleteProduct
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          example: x7Kp2QaZ
          type: string
        style: simple
      responses:
        "204":
          description: Deleted
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "`unauthorized`: no credentials. `invalid_api_key`: the API\
            \ key doesn't exist, was revoked or has expired. `invalid_token`: the\
            \ token's signature is invalid, it has expired, or the resource it's scoped\
            \ to was deleted"
        "402":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "`plan_limit_exceeded`: the organization stayed over its plan's\
            \ limits after the grace period, its API is blocked until it upgrades.\
            \ `plan_limit_reached`: creating the resource would go over the plan's\
            \ limit"
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "`token_not_allowed`: the endpoint doesn't accept tokens, or\
            \ not of this type. `insufficient_scope`: the token lacks the permission.\
            \ `no_active_organization` or `forbidden`: the session has no organization,\
            \ or isn't a member of the one requested"
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Product not found
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "`product_in_use`: licenses belong to the live product"
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "`validation_error`: invalid path, query or body, with the\
            \ `issues`"
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "`rate_limited`: the API key made more than 10 requests in\
            \ the last second. Wait for the `Retry-After` seconds"
      summary: Delete a product
      tags:
      - Products
      x-required-permissions:
      - product:delete
      x-accepts:
      - application/json
    get:
      operationId: getProduct
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          example: x7Kp2QaZ
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
          description: Product
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "`unauthorized`: no credentials. `invalid_api_key`: the API\
            \ key doesn't exist, was revoked or has expired. `invalid_token`: the\
            \ token's signature is invalid, it has expired, or the resource it's scoped\
            \ to was deleted"
        "402":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "`plan_limit_exceeded`: the organization stayed over its plan's\
            \ limits after the grace period, its API is blocked until it upgrades.\
            \ `plan_limit_reached`: creating the resource would go over the plan's\
            \ limit"
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "`token_not_allowed`: the endpoint doesn't accept tokens, or\
            \ not of this type. `insufficient_scope`: the token lacks the permission.\
            \ `no_active_organization` or `forbidden`: the session has no organization,\
            \ or isn't a member of the one requested"
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Product not found
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "`validation_error`: invalid path, query or body, with the\
