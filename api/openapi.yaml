        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "`rate_limited`: the API key made more than 10 requests in\
            \ the last second. Wait for the `Retry-After` seconds"
      summary: Get a product
      tags:
      - Products
      x-accepts:
      - application/json
    patch:
